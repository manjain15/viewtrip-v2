[project]
name = "viewtrip"
version = "0.1.0"
description = "Sydney public transport trip planner (v2 rewrite of the Y12 SDD major project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewtrip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
